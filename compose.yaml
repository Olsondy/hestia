services:
  postgres:
    image: postgres:17.7
    environment:
      POSTGRES_DB: hestia
      POSTGRES_USER: hestia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:local first}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - hestia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hestia -d hestia"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  hestia-postgres:
