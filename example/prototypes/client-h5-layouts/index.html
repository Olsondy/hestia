<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H5 客户端 · 布局探索（原型）</title><style>/* H5 布局探索：三种布局共用同一中性配色，浅色 / 深色为同一风格的两种主题。 */
*{box-sizing:border-box}
body{margin:0;background:#e6e5e1;font-family:-apple-system,'SF Pro Display','PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',system-ui,sans-serif;color:#141414;-webkit-font-smoothing:antialiased}
button,textarea{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
img{display:block}
small{display:block}

/* 展板 */
.board-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 32px;background:#e6e5e1ee;backdrop-filter:blur(10px)}
.board-head b{font-size:17px;font-weight:600}
.board-head small{font-size:12px;color:#6d6a64;margin-top:3px}
.controls{display:flex;gap:10px}
.controls nav{display:flex;background:#fff;border-radius:999px;padding:4px;box-shadow:0 4px 18px #0000000f}
.controls nav button{padding:8px 16px;border-radius:999px;font-size:13px;color:#55524c;white-space:nowrap}
.controls nav button.on{background:#141414;color:#fff}
.board{display:grid;grid-template-columns:repeat(3,390px);justify-content:center;gap:28px 36px;padding:16px 32px 60px}
.col-head{min-height:70px;padding:0 4px 12px}
.col-head b{font-size:15px;font-weight:600}
.col-head small{font-size:12px;color:#6d6a64;line-height:1.6;margin-top:4px}
.phone{position:relative;width:390px;height:844px;border-radius:52px;padding:10px;background:#111;box-shadow:0 30px 80px #0003,inset 0 0 0 2px #2b2b2b}
.notch{position:absolute;z-index:9;top:20px;left:50%;transform:translateX(-50%);width:112px;height:32px;border-radius:20px;background:#000}
.screen{position:relative;height:100%;border-radius:42px;overflow:hidden;background:var(--bg);color:var(--ink)}

/* 主题：同一中性配色的浅色与深色 */
.t-light{--bg:#f2f1ee;--surface:#fff;--raised:#fff;--ink:#141414;--muted:#77736c;--line:#e4e0d8;--soft:#ebe8e2;--cta:#141414;--cta-ink:#fff;--em:#141414;--em-ink:#fff;--warm:#9a8360;
  --glass:#ffffffbd;--glass-ink:#141414;--nav:#141414;--nav-ink:#bdb9b1;--nav-on:#fff;--nav-on-ink:#141414;--lift:0 1px 2px #00000008,0 6px 18px #0000000b;--differ:#f3ead8}
.t-dark{--bg:#0f0f10;--surface:#1b1b1d;--raised:#232326;--ink:#f3f2ee;--muted:#9a978f;--line:#2e2e31;--soft:#26262a;--cta:#f3f2ee;--cta-ink:#0f0f10;--em:#f3f2ee;--em-ink:#0f0f10;--warm:#cdb48a;
  --glass:#0f0f1094;--glass-ink:#f3f2ee;--nav:#232326;--nav-ink:#8d8a83;--nav-on:#f3f2ee;--nav-on-ink:#0f0f10;--lift:none;--differ:#3a3125}

/* 通用 */
.scroll{height:100%;overflow-y:auto;padding:58px 18px 120px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;position:relative;z-index:3}
.topbar b{font-size:16px;font-weight:600}
.topbar.over{position:absolute;top:58px;left:18px;right:18px;color:#fff}
.topbar.over b{text-shadow:0 1px 8px #0007}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--lift)}
.topbar.over .round{background:#0f0f1059;color:#fff;backdrop-filter:blur(12px)}
.logo{width:40px;height:40px;border-radius:12px;border:1px dashed var(--line);display:grid;place-items:center;font-size:9px;color:var(--muted)}
.topbar.over .logo{border-color:#ffffff80;color:#fff}
.kicker{font-size:11px;letter-spacing:.03em;opacity:.7}
.cta{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:16px;padding:8px 8px 8px 22px;min-height:56px;border-radius:999px;background:var(--cta);color:var(--cta-ink);font-size:16px;font-weight:600}
.cta span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--cta-ink);color:var(--cta)}
.cta.small{justify-content:center;min-height:50px;padding:0 20px;margin:0;font-size:15px;flex:1}
.cta.wide{width:100%}
.ghost-btn{display:inline-flex;align-items:center;gap:6px;min-height:50px;padding:0 18px;border-radius:999px;background:var(--surface);font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.round-btn{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:12px}
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);color:var(--glass-ink)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);white-space:nowrap}
.pal{display:grid;grid-template-columns:1fr 1fr;width:46px;height:46px;border-radius:12px;overflow:hidden;flex-shrink:0}
.pal i{display:block}
.pal.xs{width:20px;height:20px;border-radius:50%}
.pal.md{width:40px;height:40px;border-radius:11px}
.pal.lg{width:100%;height:70px;border-radius:14px}
.sw{width:46px;height:46px;border-radius:12px;object-fit:cover;flex-shrink:0}
.sq{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px}
.sq-s{width:40px;height:40px;border-radius:11px;object-fit:cover}
.dot{width:30px;height:30px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{padding:8px 13px;border-radius:999px;font-size:13px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.chip.on{background:var(--em);color:var(--em-ink);box-shadow:none}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface);box-shadow:var(--lift)}
.seg button{flex:1;padding:10px 0;border-radius:999px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--em);color:var(--em-ink);font-weight:600}
.list{margin-top:12px;border-radius:20px;background:var(--surface);box-shadow:var(--lift);padding:2px 16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;padding:12px 0;font-size:13px;border-bottom:1px solid var(--line);text-align:left}
.row:last-child{border-bottom:0}
.row>span:first-child{color:var(--muted);flex-shrink:0}
.row b{font-weight:600;text-align:right}
.pick-row .grow{flex:1;color:var(--ink)!important}
.pick-row b{text-align:left;display:block}
.pick-row small{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.radio{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line);flex-shrink:0}
.pick-row.on .radio{background:var(--em);color:var(--em-ink);box-shadow:none}
.field{display:block;margin-top:12px}
.field textarea,.b textarea{width:100%;padding:12px 14px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;resize:none}
.toggle-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:13px 16px;border-radius:18px;background:var(--surface);box-shadow:var(--lift)}
.toggle-row b,.row-b b{font-size:14px;font-weight:600}
.toggle-row small,.row-b small{font-size:12px;color:var(--muted);margin-top:2px}
.switch{display:block;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex-shrink:0}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003}
.switch.on{background:var(--em)}
.t-dark .switch.on i{background:#0f0f10}
.switch.on i{left:23px}
.dock{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;gap:8px;padding:14px 18px 30px;background:linear-gradient(transparent,var(--bg) 32%)}
.tabbar{position:absolute;left:50%;bottom:24px;z-index:6;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--nav);box-shadow:0 12px 30px #00000033}
.tabbar button{display:flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;color:var(--nav-ink);font-size:13px;white-space:nowrap}
.tabbar button span{display:none}
.tabbar button.on{background:var(--nav-on);color:var(--nav-on-ink)}
.tabbar button.on span{display:inline}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:24px 2px 10px}
.section-title b{font-size:16px;font-weight:600}
.section-title span{font-size:11px;color:var(--muted)}
.tiny{font-size:11px;color:var(--muted);margin:8px 2px 0}
.aerial{position:relative;margin-top:12px;border-radius:20px;overflow:hidden;aspect-ratio:16/9}
.aerial img{width:100%;height:100%;object-fit:cover}
.aerial .pill{position:absolute;left:10px;bottom:10px}

/* ① 沉浸全屏 */
.full{position:absolute;inset:0}
.full img{width:100%;height:100%;object-fit:cover;object-position:62% 60%}
.shade{position:absolute;inset:0;background:linear-gradient(#0000 35%,#000a 85%)}
.shade.top{background:linear-gradient(#0006,#0000 22%,#0000 55%,#0005)}
.full-copy{position:absolute;left:22px;right:22px;bottom:200px;color:#fff}
.full-copy h1{font-size:32px;line-height:1.16;font-weight:650;letter-spacing:-.035em;margin:8px 0 0}
.full-copy .cta{background:#fff;color:#141414}.full-copy .cta span{background:#141414;color:#fff}
.swipe-hint{font-size:11px;text-align:center;opacity:.7;margin:12px 0 0}
.sheet-under{position:absolute;left:0;right:0;bottom:0;height:180px;border-radius:28px 28px 0 0;background:var(--bg);padding:10px 20px 0}
.grab{display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.steps{display:flex;gap:10px}
.steps div{flex:1;font-size:12px;line-height:1.5}
.steps b{display:block;font-size:18px;font-weight:650;margin-bottom:2px}
.pager{position:absolute;top:110px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.pager i{width:7px;height:7px;border-radius:4px;background:#ffffff80;transition:width .3s}
.pager i.on{width:22px;background:#fff}
.side-actions{position:absolute;right:16px;top:44%;display:grid;gap:10px}
.fab{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#0f0f1066;color:#fff;backdrop-filter:blur(12px)}
.fab.on{background:#fff;color:#141414}
.nav-arrow{position:absolute;top:44%;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#0f0f1055;color:#fff;backdrop-filter:blur(10px)}
.nav-arrow.l{left:12px}.nav-arrow.r{right:70px;display:none}
.drawer{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:8px 18px 28px;border-radius:30px 30px 0 0;background:var(--bg);box-shadow:0 -10px 40px #0000002e;transition:transform .4s}
.drawer.open{max-height:76%;overflow-y:auto;scrollbar-width:none}
.drawer.tall{max-height:62%}
.grab-btn{display:block;width:100%;padding:4px 0}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.drawer-title{display:block;font-size:26px;font-weight:650;letter-spacing:-.03em;margin-top:2px}
.drawer-quick{display:flex;gap:12px;align-items:center;margin-top:14px;padding:10px;border-radius:18px;background:var(--surface);box-shadow:var(--lift)}
.drawer-quick b{font-size:14px;font-weight:600}
.drawer-quick small{font-size:12px;color:var(--muted);margin-top:2px}
.drawer-actions{display:flex;gap:8px;margin-top:16px}
.float-tag{position:absolute;left:50%;transform:translateX(-50%);top:112px;white-space:nowrap}
.adjust-drawer .seg{margin-top:2px}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:14px -18px 0;padding:0 18px 2px;scrollbar-width:none}
.style-card{flex:0 0 132px;text-align:left;padding:8px;border-radius:20px;background:var(--surface);box-shadow:var(--lift)}
.style-card.on{box-shadow:inset 0 0 0 2px var(--em)}
.style-card b{display:block;font-size:14px;font-weight:600;margin:8px 4px 0}
.style-card small{font-size:11px;color:var(--muted);margin:2px 4px 4px;line-height:1.45}
.stone-card{flex:0 0 84px;text-align:left}
.stone-card span{display:block;font-size:12px;margin-top:6px;white-space:nowrap}
.stone-card.on .sq{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--em)}
.half{position:absolute;left:0;right:0;top:0;height:46%}
.half img{width:100%;height:100%;object-fit:cover;object-position:60% 60%}

/* ② 画廊对比 */
.display{font-size:34px;line-height:1.14;font-weight:650;letter-spacing:-.04em;margin:18px 2px 0}
.body{font-size:14px;line-height:1.7;color:var(--muted);margin:10px 2px 0}
.gallery-row{display:flex;gap:12px;overflow-x:auto;margin:20px -18px 0;padding:0 18px;scroll-snap-type:x mandatory;scrollbar-width:none}
.g-card{position:relative;flex:0 0 250px;scroll-snap-align:start;text-align:left}
.g-card img{width:250px;height:300px;object-fit:cover;object-position:60% 60%;border-radius:24px}
.g-num{position:absolute;top:12px;left:14px;font-size:13px;font-weight:600;color:#fff;text-shadow:0 1px 6px #0008}
.g-card b{display:block;font-size:18px;font-weight:650;margin:10px 4px 0}
.g-card small{font-size:12px;color:var(--muted);margin:2px 4px 0}
.stone-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stone-grid figure{margin:0}
.stone-grid figcaption,.stone-grid button span{display:block;font-size:12px;margin-top:6px}
.stone-grid.small{grid-template-columns:repeat(6,1fr);gap:6px}
.stone-grid.small .sq{border-radius:10px}
.stone-grid.small span{font-size:9px;white-space:nowrap;overflow:hidden}
.stone-grid button.on .sq{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--em)}
.stack{display:grid;gap:14px}
.s-card{border-radius:26px;background:var(--surface);box-shadow:var(--lift);overflow:hidden;cursor:pointer}
.s-card.on{box-shadow:inset 0 0 0 2px var(--em)}
.s-img{position:relative;aspect-ratio:16/10}
.s-img img{width:100%;height:100%;object-fit:cover;object-position:60% 60%}
.s-img .pill{position:absolute;right:10px;top:10px}
.s-body{display:flex;justify-content:space-between;align-items:flex-end;padding:12px 16px 0}
.s-body b{display:block;font-size:21px;font-weight:650;letter-spacing:-.02em}
.s-specs{display:flex;gap:10px;align-items:center;padding:10px 16px 14px}
.s-specs .sw{width:28px;height:28px;border-radius:8px}
.s-specs small{font-size:12px;color:var(--muted)}
.split{display:grid;grid-template-rows:1fr 1fr;gap:6px;height:330px}
.split figure{position:relative;margin:0;border-radius:20px;overflow:hidden}
.split img{width:100%;height:100%;object-fit:cover;object-position:60% 62%}
.split figcaption{position:absolute;left:10px;top:10px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--glass);color:var(--glass-ink);backdrop-filter:blur(12px)}
.pick{display:flex;gap:6px;margin-top:12px}
.pick .chip{flex:1;text-align:center}
.diff{margin-top:12px;border-radius:20px;background:var(--surface);box-shadow:var(--lift);padding:4px 12px}
.drow{display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;padding:11px 4px;font-size:12px;border-bottom:1px solid var(--line);border-radius:10px}
.drow:last-child{border-bottom:0}
.drow span{color:var(--muted)}
.drow b{font-weight:600}
.drow.differs{background:var(--differ)}
.drow.same b{font-weight:400;color:var(--muted)}
.before-after{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.before-after figure{position:relative;margin:0;border-radius:20px;overflow:hidden;aspect-ratio:3/4}
.before-after img{width:100%;height:100%;object-fit:cover;object-position:60% 60%}
.before-after figcaption{position:absolute;left:8px;bottom:8px;padding:5px 9px;border-radius:999px;font-size:11px;background:var(--glass);color:var(--glass-ink);backdrop-filter:blur(12px)}
.before-after .after img{filter:saturate(.6) blur(1.5px)}
.pending{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:650;text-shadow:0 1px 8px #0009}
.poster{position:relative;margin:0;border-radius:26px;overflow:hidden;aspect-ratio:4/3.6}
.poster img{width:100%;height:100%;object-fit:cover;object-position:60% 60%}
.poster figcaption{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 16px;color:#fff;background:linear-gradient(#0000,#0009)}
.poster b{display:block;font-size:26px;font-weight:650;letter-spacing:-.03em}

/* ③ 仪表板 Bento */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.b{position:relative;border-radius:22px;background:var(--surface);box-shadow:var(--lift);padding:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:110px}
.b b{font-size:15px;font-weight:650;letter-spacing:-.01em}
.b small{font-size:11px;color:var(--muted)}
.b img:not(.sq-s):not(.dot){position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 60%}
.b .pill{position:absolute;left:10px;top:10px}
.b-hero,.b-main,.b-preview{grid-column:span 2;min-height:250px;padding:0}
.b-preview{min-height:200px}
.b-over{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;display:flex;flex-direction:column;gap:2px;color:#fff;background:linear-gradient(#0000,#000a)}
.b-over small{color:#fffc}
.b-hero .b-over b{font-size:24px;letter-spacing:-.03em}
.b-cta{background:var(--cta);color:var(--cta-ink);justify-content:space-between}
.b-cta span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--cta-ink);color:var(--cta)}
.b-num{justify-content:flex-end}.b-num b{font-size:44px;line-height:1;letter-spacing:-.04em}
.mini-sw{display:flex;margin:6px 0}.mini-sw .dot+.dot{margin-left:-8px}
.b-share svg{color:var(--warm)}
.b-share{justify-content:flex-end}
.b-3d{min-height:120px;padding:0}.b-3d .b-over{flex-direction:row;align-items:center;gap:6px}
.b-state b{font-size:26px;letter-spacing:-.03em;margin-top:auto}
.b-wide{grid-column:span 2;min-height:0}
.opt3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.opt3 button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:8px;border-radius:16px;background:var(--soft);font-size:12px}
.opt3 button.on{background:var(--em);color:var(--em-ink)}
.opt6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:4px}
.opt6 button{border-radius:12px;padding:2px}
.opt6 button.on{box-shadow:inset 0 0 0 2px var(--em)}
.opt6 .sq-s{width:100%;height:auto;aspect-ratio:1}
.stepper{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.stepper button{width:32px;height:32px;border-radius:50%;background:var(--soft);font-size:18px}
.stepper b{font-size:22px;font-variant-numeric:tabular-nums}
.row-b{flex-direction:row;justify-content:space-between;align-items:center}
